display_information:
  name: Faraj's Lekam
  description: The front door for our coding agents. Ask here; the owner approves; agents do the work.
  background_color: "#1f2937"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Faraj's Lekam
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:write
      - chat:write
      - reactions:write
      - reactions:read
      - users:read
    user:
      - chat:write          # optional: lets owner-approved replies to owner-tags post as the owner
      - im:history          # optional (capture_dms): read the DMs people send the owner
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - member_joined_channel
      - member_left_channel
    user_events:
      - message.im          # optional (capture_dms): DMs people send the owner
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
