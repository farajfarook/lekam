display_information:
  name: Faraj's Lekam
  description: Chat with your Paseo agents from Slack. Forward a message to Lekam and talk about it.
  background_color: "#1f2937"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Faraj's Lekam
    always_online: true
oauth_config:
  scopes:
    bot:
      - im:history       # read the owner's DMs with Lekam
      - chat:write       # reply in those DM threads
      - reactions:write  # the ⚙️ while a session works
      - users:read       # the owner's name for the session
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
