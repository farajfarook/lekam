display_information:
  name: Lekam
  description: The front door for our coding agents. Ask here; the owner approves; agents do the work.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Lekam
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - groups:history
      - im:history
      - im:write
      - chat:write
      - reactions:write
      - reactions:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - member_joined_channel
      - member_left_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
