# Lekam configuration. Copy to lekam.yml and edit. Secrets are NEVER put here:
# every *_env key names an environment variable that holds the value.

persona_file: ./persona.md        # the bot's voice and rules (prepended to every brain prompt)
guardrails_file: ./guardrails.md  # prepended to every worker brief
# catalogue_file: ./catalogue.md  # optional: replaces the auto-generated skills section

chat:
  platform: slack
  bot_token_env: LEKAM_SLACK_BOT_TOKEN   # xoxb-...
  app_token_env: LEKAM_SLACK_APP_TOKEN   # xapp-... (Socket Mode)
  thread_engagement: 24h                 # after Lekam posts in a thread, untagged replies there are treated as addressed to it
  reactions:                             # status shown on the originating message
    pending: eyes
    running: gear
    done: white_check_mark
    declined: no_entry_sign
    failed: x
    needs_info: question

brain:
  base_url_env: LITELLM_RMS_URL          # OpenAI-compatible endpoint (LiteLLM, OpenAI, ...)
  api_key_env: LEKAM_BRAIN_KEY
  classify_model: claude-sonnet-5-5      # reading who a thread message is addressed to needs a capable model
  brief_model: claude-sonnet-5-5         # also writes the owner-voice rewrite
  threshold: 0.7                         # owner-mentions below this never become cards
  thread_context_messages: 20
  recent_outcomes: 10
  catalogue_max_chars: 16000
  timeout_ms: 60000
  max_tokens: 2500                       # reasoning models think before answering; keep headroom

approvals:
  ttl_bot_mention: 24h
  ttl_owner_mention: 4h
  outward_actions_mode: ask              # ask = checkboxes per request; proposed = brief's actions allowed, shown as a line; all = agent may do anything (shown on the card)
  owner_auto_start: true                 # the owner tagging Lekam starts the job with no approval card; the reply still waits for Post
  owner_withhold: [slack_post, email_send] # outward actions NOT granted on those auto-started jobs (all others are)
  force_card_patterns:                   # regex; any match on a follow-up forces a new card
    - "\\bPR\\b"
    - "\\bdeploy"
    - "\\bmerge\\b"
    - "\\bprod\\b"
    - "\\bjira\\b"
    - "\\bemail\\b"
    - "\\bdelete\\b"

limits:
  per_user_per_hour: 10
  pending_per_owner: 20

store:
  path: ./lekam.db

# Outward actions the brain may propose and the owner approves per request.
outward_actions:
  jira_create: Create a Jira ticket
  jira_comment: Comment on Jira
  pr_create: Raise a pull request
  pr_review: Approve or review a pull request
  slack_post: Post to Slack
  email_send: Send email
  deploy_approve: Approve a deployment

# Repositories the brain may name in a brief.
repos:
  - name: example-app
    url: https://github.com/acme/example-app
    default_branch: main
    notes: .NET API (api/) + React (ui/)

# Directories scanned for */SKILL.md to build the brain's catalogue.
# Optional: live data sources your agents can reach. Questions about these become cards instead of "I can't".
agent_tools:
  - "Jira: tickets, sprints"
  - "GitHub: PRs, CI checks"

# Optional: people to @-tag in posted results. A JSON roster ({members:[{name, slackId, github}]} or a list),
# and/or inline entries.
# people_file: ./roster.json
# people:
#   - { name: Jane Doe, slack_id: U0123456789, github: jdoe, aliases: [Janey] }

skills_dirs:
  - ~/.agents/skills

# Optional: thread watches (replies to threads your manual sessions posted in come back to them; see README).
# hosts: name -> "local" (the daemon on this machine), ssh://user@host (another machine, via ssh) or ws://...
# watches:
#   ttl: 3d                      # expire after this long without a renewal or a forward
#   wait_timeout: 45m            # Forward waits this long for a busy session to finish its turn
#   catch_up_interval: 15m       # re-read watched conversations this often (also at start-up)
#   hosts:
#     my-box: local
#     other-box: ssh://root@other-box.internal
#   detect:                      # find the session behind each post made with your account
#     enabled: true
#     lookback: 10m
#     delays: [3s, 15s, 60s]
#     skip_labels: [lekam, paseo.schedule-id]

owners:
  - slack_id: U0000000000
    name: Owner
    default_for_channels: []             # bot-mentions in these channels route here
    # voice: "Casual, warm, short sentences, the odd :slightly_smiling_face:"   # or voice_file: ./voice.md; how posts as you should sound
    # capture_dms: true                 # handle DMs people send you like tags (needs the user token, user scope im:history, user event message.im)
    # user_token_env: LEKAM_SLACK_USER_TOKEN  # optional xoxp user token (user scope chat:write): replies to people who tag YOU post as you
    executor:
      type: paseo
      paseo_url: ws://127.0.0.1:6767/ws
      provider: pi/litellm/claude-haiku-5-5   # "provider/model" as Paseo expects; `lekam check` lists options
      cwd: /root/work
      max_concurrent: 2
      run_timeout: 45m
      idle_archive_days: 7
      # workspace_label: Lekam            # Paseo label for Lekam's sessions; reused if it exists, else created
      # workspace_label_color: amber       # violet sky emerald orange pink indigo teal red amber blue
